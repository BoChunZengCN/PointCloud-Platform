[project]
name = "pc-system"
version = "0.1.0"
description = "Phase 1 point cloud LAS/LAZ processing system"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3"]

[project.scripts]
pc-system = "pc_system.cli:main"

[project.optional-dependencies]
las = ["laspy"]
api = ["fastapi", "uvicorn"]
models = ["trimesh>=4,<5"]
registration = ["open3d>=0.19,<1"]
test = [
  "pytest>=8,<9",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "trimesh>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

