<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>完整点云分层预览 · PointCloud Platform</title>
    <link rel="stylesheet" href="/vendor/potree/build/potree/potree.css" />
    <link rel="stylesheet" href="/vendor/potree/libs/jquery-ui/jquery-ui.min.css" />
    <link rel="stylesheet" href="/vendor/potree/libs/openlayers3/ol.css" />
    <link rel="stylesheet" href="/vendor/potree/libs/spectrum/spectrum.css" />
    <link rel="stylesheet" href="/vendor/potree/libs/jstree/themes/mixed/style.css" />
    <link rel="stylesheet" href="full-las-preview.css" />
  </head>
  <body>
    <div class="potree_container">
      <div id="potree_render_area" aria-label="完整点云三维视图"></div>
      <div id="potree_sidebar_container"></div>
    </div>
    <header class="preview-toolbar">
      <div class="preview-heading">
        <a href="viewer.html">← 返回平台展示页</a>
        <div>
          <strong>完整 LAS 分层预览</strong>
          <span id="asset-name">等待已发布资产</span>
        </div>
      </div>
      <div class="preview-facts">
        <span>源文件总点数 <strong id="source-points">—</strong></span>
        <span>当前显示点 <strong id="visible-points">0</strong></span>
        <span>RGB <strong id="rgb-state">待检查</strong></span>
        <span>单位 <strong id="source-unit">—</strong></span>
      </div>
      <div class="preview-controls">
        <label for="point-budget">显示点预算 <output id="budget-value">1,000,000</output></label>
        <input id="point-budget" type="range" min="100000" max="5000000" step="100000" value="1000000" />
        <button id="fit-view" type="button">适应场景</button>
        <button id="top-view" type="button">俯视</button>
        <button id="front-view" type="button">前视</button>
      </div>
      <p id="load-status" role="status" aria-live="polite">正在查找已发布的完整点云版本…</p>
      <small>版本：<code id="run-id">—</code>。滑动预算只改变屏幕显示数量，不改变源文件。</small>
    </header>

    <script src="/vendor/potree/libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="/vendor/potree/libs/spectrum/spectrum.js"></script>
    <script src="/vendor/potree/libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="/vendor/potree/libs/other/BinaryHeap.js"></script>
    <script src="/vendor/potree/libs/tween/tween.min.js"></script>
    <script src="/vendor/potree/libs/d3/d3.js"></script>
    <script src="/vendor/potree/libs/proj4/proj4.js"></script>
    <script src="/vendor/potree/libs/openlayers3/ol.js"></script>
    <script src="/vendor/potree/libs/i18next/i18next.js"></script>
    <script src="/vendor/potree/libs/jstree/jstree.js"></script>
    <script src="/vendor/potree/build/potree/potree.js"></script>
    <script src="/vendor/potree/libs/plasio/js/laslaz.js"></script>
    <script src="full-las-preview.js"></script>
  </body>
</html>
