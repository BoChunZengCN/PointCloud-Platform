<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫描参考模板 · 点云平台</title><link rel="stylesheet" href="model-reference-library.css"></head>
<body><main>
<nav><a href="index.html">项目驾驶舱</a><a href="model-matching-lab.html">专业匹配工作台</a></nav>
<header><p class="eyebrow">受控导入 · 有界预览 · 专家核验</p><h1>扫描参考模板</h1><p id="role-note">正在确认服务端身份…</p></header><details class="connection"><summary>连接与身份</summary><label>API 访问令牌<input id="token" type="password" autocomplete="off" placeholder="仅保留于当前页面内存"></label><button id="connect">连接</button></details>
<p id="message" role="status" aria-live="polite">正在加载目录…</p><button id="retry" hidden>重试原操作</button>
<section><h2>第一步：创建与导入</h2><p class="muted">暂存文件仅接受服务端受控标识，不能填写绝对路径或 URL。</p><div class="form-grid">
<label>模型 ID<input id="model-id"></label><label><input id="create-new-asset" type="checkbox" checked> 创建新扫描资产</label><label>名称<input id="display-name"></label><label>类别<input id="category-id"></label><label>厂商<input id="manufacturer"></label><label>型号<input id="model-number"></label><label>关键词（逗号分隔）<input id="keywords"></label><label>标签（逗号分隔）<input id="tags"></label><label>版本 ID<input id="version-id"></label><label>受控暂存文件标识<input id="staged-source" placeholder="imports/models/scan.ply"></label><label>单位<select id="declared-unit"><option value="m">m</option><option value="cm">cm</option><option value="mm">mm</option></select></label><label>许可<input id="license"></label><label>上个版本（可选）<input id="supersedes-version-id"></label></div><label>provenance JSON<textarea id="provenance" rows="3">{}</textarea></label><button data-write id="create-import">创建并导入</button></section>
  <section><h2>第二步：检查与核验</h2><div class="filters"><button data-status="all">全部</button><button data-status="pending_review">待核验</button><button data-status="publishable">可发布</button><button data-status="published">已发布</button><button data-status="rejected">未通过</button></div><div class="catalog-pagination"><button id="previous-page">上一页</button><span id="page-status" aria-live="polite">第 1 页</span><button id="next-page">下一页</button></div><div class="layout"><div id="catalog" aria-label="扫描版本清单"></div><article id="detail" hidden><h3 id="detail-title"></h3><p id="states"></p><p id="point-count"></p><p id="dimensions"></p><p id="risk-summary"></p><p id="source-summary"></p><p id="quality-summary"></p><section id="professional-evidence" hidden aria-label="冻结专业证据"></section><div class="projection-grid"><figure><canvas id="projection-xy" width="260" height="180"></canvas><figcaption>XY 投影</figcaption></figure><figure><canvas id="projection-xz" width="260" height="180"></canvas><figcaption>XZ 投影</figcaption></figure><figure><canvas id="projection-yz" width="260" height="180"></canvas><figcaption>YZ 投影</figcaption></figure></div><p class="muted">辅助查看，不代表完整性证明。</p>
<fieldset id="review-controls"><legend>一次最终核验</legend><label><input id="single_object" type="checkbox">数据对应单个目标对象</label><label><input id="metadata_and_rights" type="checkbox">型号、来源、许可和单位可信</label><label><input id="coverage_limitations" type="checkbox">知悉扫描缺失与噪声限制</label><div id="risk-acknowledgements" aria-label="自动风险确认"></div><label>核验原因<textarea id="review-reason" maxlength="1000"></textarea></label><button data-write id="approve">确认通过</button><button data-write id="reject">提交拒绝</button></fieldset>
<section><h3>发布历史与索引</h3><p id="publication-note"></p><label>发布原因<textarea id="release-reason" maxlength="1000"></textarea></label><button data-write id="release">发布模板</button><a id="index-link" href="model-matching-lab.html" hidden>前往专业匹配/索引流程</a></section></article></div></section>
<section><h2>第三步：发布与索引提示</h2><p>发布不会自动构建或启用索引；请根据状态进入既有专业流程。</p></section>
</main><script src="model-reference-library.js"></script></body></html>
